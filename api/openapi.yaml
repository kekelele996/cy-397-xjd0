openapi: 3.0.3
info:
  title: 合同模板生成与法律工单 API 服务
  version: 1.0.0
  description: 提供合同模板管理、合同填充生成、签署状态、法律工单、工单流转、法律 FAQ 与用户合同库接口。
servers:
  - url: http://127.0.0.1:19412
paths:
  /healthz:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/auth/register:
    post:
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: demo }
                password: { type: string, example: secret123 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/login:
    post:
      summary: 登录获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: demo }
                password: { type: string, example: secret123 }
      responses:
        '200':
          description: 返回 token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /api/v1/templates:
    get:
      summary: 合同模板列表
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/templates/{id}:
    get:
      summary: 合同模板详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/contracts:
    post:
      summary: 选择模板并生成合同
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, title]
              properties:
                template_id: { type: integer, example: 1 }
                title: { type: string, example: 房屋租赁合同-2026 }
                variables:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    get:
      summary: 用户合同库
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending_signed, signed, expired] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/tickets:
    post:
      summary: 提交法律咨询工单
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, description]
              properties:
                type: { type: string, enum: [labor, contract, property, ip, other] }
                title: { type: string }
                description: { type: string }
                contract_no:
                  type: string
                  pattern: '^HT-\d{4}-\d{6}$'
                  description: 关联合同编号（HT-YYYY-000001），登记时记录合同状态快照
                  example: HT-2026-000001
                attachments:
                  type: array
                  items: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    get:
      summary: 工单列表
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/tickets/{id}:
    get:
      summary: 工单详情（实时带出合同库此刻状态与签署方）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/tickets/{id}/status:
    patch:
      summary: 工单流转（关单 closed 前强制对账合同库现状，对不上挂起为 review_pending）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, processing, replied, closed, review_pending] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409':
          description: 对账失败，工单已挂起，data 为差异明细数组
  /api/v1/tickets/{id}/resume-review:
    post:
      summary: 待复核工单复核通过（按合同库现状刷新登记快照并恢复处理）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/tickets/{id}/replies:
    post:
      summary: 添加工单回复（仅写工单侧，失败只重试工单批，合同库不回滚）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    get:
      summary: 回复列表
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/contracts/{id}/sign:
    post:
      summary: 签署合同（落定为已签署，该编号下未关工单自动标待复核）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/contracts/{id}/expire:
    post:
      summary: 合同过期（该编号下未关工单自动标待复核）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/contracts/{id}/recheck-tickets:
    post:
      summary: 合同已落定但工单批联动失败时，只重试工单这一批（合同库照旧）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/admin/tickets/batch-close:
    post:
      summary: 工单组批量关单，逐笔对账；对得上才关，对不上挂起并列明差异
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_ids]
              properties:
                ticket_ids:
                  type: array
                  items: { type: integer }
                  example: [1, 2, 3]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/admin/tickets/backfill-contract:
    post:
      summary: 旧工单按问题描述中的合同编号回填，回填不出的单列异常清单
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/admin/tickets/backfails:
    get:
      summary: 回填不出的工单异常清单
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resolved, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/faqs:
    get:
      summary: FAQ 搜索
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Response:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { type: object }
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
